<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café & Letras</title>
    <!-- Vinculación de la hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado principal -->
    <header>
        <h1>Café & Letras</h1>
        <p>Un espacio para inspirarte sorbo a sorbo</p>
    </header>

    <!-- Tarjeta Principal -->
    <main id="tarjeta">
        <p id="texto-frase">"El secreto de ir adelante es comenzar."</p>
        <p id="autor-frase">— Mark Twain</p>
        
        <div class="botones-contenedor">
            <button id="btn-nueva-frase">🔄 Nueva Frase Inspiradora</button>
            <button id="btn-cambiar-tema">🌙 Cambiar Modo Claro/Oscuro</button>
        </div>
    </main>

    <!-- Vinculación del archivo de scripts -->
    <script src="script.js"></script>
</body>
</html>
